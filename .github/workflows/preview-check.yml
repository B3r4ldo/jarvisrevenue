name: BeraldoSales Preview Validation
on:
  push:
    branches:
      - preview/beraldosales-2.2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog and generate responsive site
        run: python bot.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate expected assets
        run: |
          test -s site/index.html
          test -s site/catalog.json
          grep -q 'BeraldoSales' site/index.html
          grep -q 'Ver na Amazon' site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: beraldosales-preview-site
          path: site/
